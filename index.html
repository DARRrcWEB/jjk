<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Forced Desktop Viewport: Makes Android/iOS render the desktop layout -->
    <meta name="viewport" content="width=1280">
    <title>Jujutsu Kaisen | Character Database</title>
    
    <!-- Cross-Platform Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Rajdhani:wght@500;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ==========================================
           1. CSS VARIABLES & SYSTEM ARCHITECTURE
           ========================================== */
        :root {
            --theme-color: #ff0000; 
            --theme-dark: #0a0404;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --panel-bg: rgba(15, 10, 10, 0.75);
            --border-glass: rgba(255, 255, 255, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
            background-color: #050202;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--theme-dark);
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-image 0.6s ease-in-out, background-color 0.5s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* ------------------------------------------
           FIXED Z-INDEX FOR VIDEO & OVERLAY
           ------------------------------------------ */
        #bg-video {
            position: fixed;
            top: 50%; left: 50%;
            min-width: 100vw; min-height: 100vh; min-height: 100dvh;
            width: auto; height: auto;
            transform: translate3d(-50%, -50%, 0);
            z-index: 1; 
            object-fit: cover;
            opacity: 0;
            display: none;
            transition: opacity 0.6s ease-in-out;
            pointer-events: none;
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
            background: radial-gradient(circle at center, rgba(5, 2, 2, 0.65) 0%, rgba(5, 2, 2, 0.96) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 2; 
            transition: background 0.5s ease, backdrop-filter 0.5s ease;
            pointer-events: none;
        }

        body.video-mode .bg-overlay {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
        }

        /* ==========================================
           2. RESPONSIVE NAVIGATION & TOP-LEFT SWITCHER
           ========================================== */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px 15px 30px;
            background: linear-gradient(180deg, rgba(5, 5, 10, 0.85) 0%, rgba(5, 5, 10, 0.3) 70%, transparent 100%);
            position: sticky;
            top: 0;
            z-index: 200;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-logo {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(1.2rem, 2vw, 1.8rem);
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 15px var(--theme-color);
            display: flex;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
            cursor: pointer;
            padding: 8px 18px;
            border-radius: 30px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-glass);
            transition: all 0.3s ease;
        }

        .nav-logo:hover {
            background: rgba(0,0,0,0.7);
            border-color: var(--theme-color);
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .nav-logo i { color: var(--theme-color); transition: color 0.4s ease; }

        .expand-icon {
            font-size: 1rem;
            color: var(--text-muted);
            transition: transform 0.3s ease;
        }

        .nav-links {
            display: flex;
            gap: clamp(15px, 2.2vw, 30px);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding: 5px 0;
            scrollbar-width: none;
        }
        .nav-links::-webkit-scrollbar { display: none; }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-size: clamp(0.85rem, 1.2vw, 1.05rem);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: color 0.3s ease, text-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
            white-space: nowrap;
            padding: 4px 2px;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -2px; left: 0; width: 0%; height: 2px;
            background: var(--theme-color);
            transition: width 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 0 10px var(--theme-color);
        }

        .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }
        .nav-links a:hover, .nav-links a.active {
            color: var(--theme-color);
            text-shadow: 0 0 10px var(--theme-color);
        }

        /* ==========================================
           3. CHARACTER DROPDOWN ROSTER MENU
           ========================================== */
        .roster-menu {
            position: fixed;
            left: 30px;
            top: 85px;
            transform: translateY(-20px) scale(0.95);
            opacity: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 300;
            background: rgba(10, 10, 15, 0.9);
            padding: 18px 15px;
            border-radius: 25px;
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            max-height: 75vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Toggled via JS to show dropdown */
        .roster-menu.expanded {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .roster-menu::-webkit-scrollbar { width: 0px; }

        .char-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.3s ease, opacity 0.3s ease;
            overflow: hidden;
            opacity: 0.5;
            position: relative;
            flex-shrink: 0;
        }

        .char-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .char-icon:hover, .char-icon.active {
            opacity: 1;
            border-color: var(--theme-color);
            transform: scale(1.18);
            box-shadow: 0 0 16px var(--theme-color);
        }

        /* Hover Tooltips for Roster */
        @media (hover: hover) and (pointer: fine) {
            .char-icon::after {
                content: attr(data-name);
                position: absolute;
                left: 65px;
                top: 50%;
                transform: translateY(-50%) translateX(-10px);
                background: var(--theme-color);
                color: #000;
                padding: 6px 12px;
                border-radius: 6px;
                font-size: 0.8rem;
                font-weight: 700;
                font-family: 'Oswald', sans-serif;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.3s ease, transform 0.3s ease;
                white-space: nowrap;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
                z-index: 301;
            }
            .char-icon:hover::after {
                opacity: 1;
                transform: translateY(-50%) translateX(0);
            }
        }

        /* ==========================================
           4. FLUID MAIN CONTENT & 3D LAYOUT
           ========================================== */
        #layout-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .char-layout {
            width: 100%;
            animation: fadeInLayout 0.5s ease-out forwards;
        }

        @keyframes fadeInLayout {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .container {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: clamp(25px, 4vw, 55px);
            padding: 30px 40px 40px 40px;
            max-width: 1650px;
            margin: 0 auto;
            width: 100%;
            align-items: center;
        }

        .content-area {
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .title-group {
            position: relative;
            margin-bottom: 25px;
        }

        .kanji {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            color: rgba(255, 255, 255, 0.08);
            position: absolute;
            top: -25px;
            left: 0;
            z-index: -1;
            letter-spacing: 12px;
            user-select: none;
            pointer-events: none;
            font-weight: 700;
        }

        .quote {
            font-size: clamp(0.95rem, 1.4vw, 1.25rem);
            font-style: italic;
            color: var(--theme-color);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            border-left: 3px solid var(--theme-color);
            padding-left: 14px;
            line-height: 1.4;
        }

        .page-title {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(2.6rem, 5.5vw, 5.5rem);
            line-height: 1.05;
            letter-spacing: clamp(1px, 0.5vw, 3px);
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 2px 2px 20px rgba(0,0,0,0.8), 0 0 30px var(--theme-color);
            margin: 4px 0;
        }

        .page-subtitle {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(1.1rem, 1.8vw, 1.6rem);
            color: var(--text-main);
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--theme-color), #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Glass Cards */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 18px;
            margin-top: 20px;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .info-card {
            background: var(--panel-bg);
            padding: clamp(18px, 2.2vw, 25px);
            border-radius: 14px;
            border: 1px solid var(--border-glass);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            position: relative;
            overflow: hidden;
        }

        .info-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--theme-color);
            box-shadow: 0 0 15px var(--theme-color);
        }

        .info-card h3 {
            color: var(--theme-color);
            font-family: 'Oswald', sans-serif;
            font-size: clamp(1.1rem, 1.5vw, 1.35rem);
            margin-bottom: 12px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-card p, .info-card ul {
            font-size: clamp(0.85rem, 1.1vw, 0.95rem);
            line-height: 1.6;
            color: var(--text-main);
        }
        
        .info-card ul { list-style: none; }
        
        .info-card li {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        
        .info-card li span:first-child { color: var(--text-muted); font-weight: 500; }

        /* Full Animated Gallery with Downloads */
        .full-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            margin-top: 15px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .full-gallery::-webkit-scrollbar { width: 5px; }
        .full-gallery::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 10px; }
        .full-gallery::-webkit-scrollbar-thumb { background: var(--theme-color); border-radius: 10px; }

        .gallery-item-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            border-radius: 10px;
            overflow: hidden;
            opacity: 0;
            transform: scale(0.85);
            animation: galleryPop 0.4s forwards cubic-bezier(0.16, 1, 0.3, 1);
            background: #111;
        }

        .gallery-item-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.4s ease, border-color 0.3s ease;
        }

        .gallery-item-wrap img:hover, .gallery-item-wrap img.active {
            transform: scale(1.08);
            border-color: var(--theme-color);
        }

        .download-btn {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            width: 34px;
            height: 34px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease, border-color 0.3s ease;
            z-index: 10;
        }

        .download-btn:hover {
            background: var(--theme-color);
            color: #fff;
            border-color: var(--theme-color);
            transform: scale(1.1);
        }

        @keyframes galleryPop { to { opacity: 1; transform: scale(1); } }

        /* Bottom Gallery Thumbnails */
        .image-gallery {
            display: flex;
            gap: 12px;
            margin-top: 30px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 6px;
            scrollbar-width: thin;
        }

        .image-gallery img {
            width: clamp(70px, 9vw, 95px);
            height: clamp(50px, 6vw, 68px);
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.3s ease, opacity 0.3s ease, border-color 0.3s ease;
            opacity: 0.55;
            flex-shrink: 0;
        }

        .image-gallery img:hover, .image-gallery img.active {
            border-color: var(--theme-color);
            opacity: 1;
            transform: translateY(-4px);
            box-shadow: 0 8px 18px var(--theme-color);
        }

        /* 3D Visual Hero Card */
        .hero-visual {
            perspective: 1200px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .tilt-card {
            width: 100%;
            max-width: 440px;
            aspect-ratio: 3/4.2;
            position: relative;
            transform-style: preserve-3d;
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9), 0 0 35px rgba(0,0,0,0.5);
            transition: transform 0.15s ease-out;
            will-change: transform;
        }

        .tilt-card img.main-display-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            position: absolute;
            top: 0; left: 0;
            border: 1px solid var(--border-glass);
        }

        .card-glare {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 60%);
            transform: translateZ(35px);
            pointer-events: none;
        }

        .card-badge {
            position: absolute;
            bottom: -15px; right: -15px;
            background: var(--theme-dark);
            border: 2px solid var(--theme-color);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            color: var(--theme-color);
            box-shadow: 0 0 20px var(--theme-color);
            transform: translateZ(60px);
        }

        /* ==========================================
           5. ANIMATED FEEDBACK FORM (WITH 5-STAR RATING)
           ========================================== */
        @keyframes pulseFeedback {
            0% { transform: scale(1); box-shadow: 0 0 0 0 var(--theme-color); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255,255,255,0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0); }
        }

        .feedback-toggle {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--panel-bg);
            border: 2px solid var(--theme-color);
            color: var(--theme-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            cursor: pointer;
            z-index: 400;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: pulseFeedback 2.5s infinite ease-in-out;
            transition: all 0.3s ease;
        }

        .feedback-toggle:hover {
            animation: none;
            background: var(--theme-color);
            color: #fff;
            transform: scale(1.1);
            box-shadow: 0 0 20px var(--theme-color);
        }

        .feedback-panel {
            position: fixed;
            bottom: 100px;
            left: 30px;
            width: 320px;
            background: var(--panel-bg);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 20px;
            z-index: 400;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .feedback-panel.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .feedback-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-family: 'Oswald', sans-serif;
            color: var(--theme-color);
            font-size: 1.3rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .feedback-header i {
            cursor: pointer;
            color: var(--text-main);
            transition: color 0.3s;
        }
        .feedback-header i:hover { color: var(--theme-color); transform: scale(1.2); }

        .feedback-panel form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 5-Star Rating CSS */
        .star-rating {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 5px 0 10px;
        }
        .star-rating i {
            font-size: 1.6rem;
            color: rgba(255,255,255,0.3);
            cursor: pointer;
            transition: color 0.2s ease, transform 0.2s ease;
        }
        .star-rating i.hovered, .star-rating i.active-star {
            color: #f59e0b; /* Golden Yellow */
        }
        .star-rating i.selected-star {
            transform: scale(1.2);
            color: #f59e0b;
        }

        .feedback-panel input, .feedback-panel textarea {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 10px 12px;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .feedback-panel input:focus, .feedback-panel textarea:focus {
            border-color: var(--theme-color);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.1);
        }

        .feedback-panel button {
            background: var(--theme-color);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
        }

        .feedback-panel button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px var(--theme-color);
            filter: brightness(1.2);
        }

        /* ==========================================
           6. FOOTER
           ========================================== */
        footer {
            text-align: center;
            padding: 20px 20px 20px 20px;
            background: rgba(5, 5, 10, 0.85);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            z-index: 10;
        }

        /* Responsive Fallbacks just in case window is resized */
        @media (max-width: 1100px) {
            .container { grid-template-columns: 1fr; gap: 35px; padding-top: 20px; }
            .hero-visual { order: -1; }
            .tilt-card { max-width: 320px; }
        }
    </style>
</head>
<body>

    <!-- 🎥 Cross-Platform Background Video -->
    <video id="bg-video" autoplay loop muted playsinline webkit-playsinline></video>
    
    <div class="bg-overlay" id="bg-overlay"></div>

    <!-- 🌐 Global Top Navigation with Dropdown Trigger -->
    <nav>
        <div class="nav-logo" id="nav-logo-element" onclick="toggleRoster()" title="Switch Character">
            <i class="fa-solid fa-fire" id="nav-icon"></i> 
            <span id="nav-text">SUKUNA</span>
            <i class="fa-solid fa-chevron-down expand-icon" id="expand-icon"></i>
        </div>
        <div class="nav-links" id="dynamic-nav">
            <!-- Nav links injected via JS -->
        </div>
    </nav>

    <!-- 📱 Character Selector Roster (Dropdown) -->
    <aside class="roster-menu" id="roster-menu" aria-label="Character Selection">
        <div class="char-icon active" id="btn-sukuna" data-name="Ryomen Sukuna" onclick="switchCharacter('sukuna')">
            <img src="photos/sukuna 4.jpg" alt="Sukuna" loading="lazy">
        </div>
        <div class="char-icon" id="btn-gojo" data-name="Gojo Satoru" onclick="switchCharacter('gojo')">

        let activeChar = 'sukuna'; 

        // ==========================================
        // 2. VIDEO & MEDIA CONTROLLERS
        // ==========================================
        function forceHideVideo() {
            const bgVideo = document.getElementById('bg-video');
            bgVideo.pause();
            bgVideo.style.opacity = '0';
            bgVideo.style.display = 'none';
            document.body.classList.remove('video-mode');
        }

        function forceShowVideo(src) {
            const bgVideo = document.getElementById('bg-video');
            const encodedSrc = encodeURI(src);
            
            if (!bgVideo.getAttribute('src') || !bgVideo.getAttribute('src').includes(encodedSrc)) {
                bgVideo.setAttribute('src', encodedSrc);
            }
            
            bgVideo.style.display = 'block';
            document.body.classList.add('video-mode');
            
            setTimeout(() => { 
                bgVideo.style.opacity = '1'; 
            }, 50);
            
            const playPromise = bgVideo.play();
            if (playPromise !== undefined) {
                playPromise.catch(e => {
                    console.log("Device autoplay constraint handled:", e);
                });
            }
            document.body.style.backgroundImage = 'none';
        }

        // Cross-Device Safe Image Downloader
        async function downloadImageFile(url) {
            try {
                const filename = url.substring(url.lastIndexOf('/') + 1);
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(blobUrl);
            } catch (err) {
                const fallbackLink = document.createElement('a');
                fallbackLink.href = url;
                fallbackLink.target = "_blank";
                fallbackLink.download = url.substring(url.lastIndexOf('/') + 1);
                document.body.appendChild(fallbackLink);
                fallbackLink.click();
                document.body.removeChild(fallbackLink);
            }
        }

        // ==========================================
        // 3. UI DROPDOWN TOGGLE FOR TOP-LEFT NAV
        // ==========================================
        function toggleRoster() {
            const roster = document.getElementById('roster-menu');
            const icon = document.getElementById('expand-icon');
            roster.classList.toggle('expanded');
            
            if (roster.classList.contains('expanded')) {
                icon.classList.remove('fa-chevron-down');
                icon.classList.add('fa-chevron-up');
            } else {
                icon.classList.remove('fa-chevron-up');
                icon.classList.add('fa-chevron-down');
            }
        }

        // Close roster when clicking outside
        document.addEventListener('click', function(event) {
            const roster = document.getElementById('roster-menu');
            const trigger = document.getElementById('nav-logo-element');
            if (roster && trigger && roster.classList.contains('expanded') && !roster.contains(event.target) && !trigger.contains(event.target)) {
                toggleRoster();
            }
        });

        // ==========================================
        // 4. UI FEEDBACK TOGGLE & STAR RATING LOGIC
        // ==========================================
        function toggleFeedback() {
            const panel = document.getElementById('feedback-panel');
            panel.classList.toggle('show');
        }

        // Star Rating JS Logic
        document.addEventListener('DOMContentLoaded', () => {
            const stars = document.querySelectorAll('.star-rating i');
            const ratingInput = document.getElementById('rating-value');
            
            stars.forEach(star => {
                star.addEventListener('mouseover', function() {
                    let val = parseInt(this.dataset.value);
                    stars.forEach(s => {
                        if (parseInt(s.dataset.value) <= val) {
                            s.classList.remove('fa-regular');
                            s.classList.add('fa-solid', 'hovered');
                        } else {
                            s.classList.remove('fa-solid', 'hovered');
                            s.classList.add('fa-regular');
                        }
                    });
                });

                star.addEventListener('mouseout', function() {
                    let val = parseInt(ratingInput.value);
                    stars.forEach(s => {
                        s.classList.remove('hovered');
                        if (parseInt(s.dataset.value) <= val) {
                            s.classList.remove('fa-regular');
                            s.classList.add('fa-solid');
                        } else {
                            s.classList.remove('fa-solid');
                            s.classList.add('fa-regular');
                        }
                    });
                });

                star.addEventListener('click', function() {
                    ratingInput.value = this.dataset.value;
                    stars.forEach(s => s.classList.remove('selected-star'));
                    this.classList.add('selected-star');
                });
            });
            
            // Auto-load main character on initial launch
            switchCharacter('sukuna'); 
        });

        // ==========================================
        // 5. CHARACTER SWITCHING ENGINE
        // ==========================================
        function switchCharacter(charId) {
            const data = characterDB[charId];
            if (!data) return; // Failsafe if character isn't found
            
            activeChar = charId;

            // Close roster dropdown if open
            const roster = document.getElementById('roster-menu');
            if(roster && roster.classList.contains('expanded')) {
                toggleRoster();
            }

            // Update Roster UI
            document.querySelectorAll('.char-icon').forEach(icon => icon.classList.remove('active'));
            const activeIcon = document.getElementById(`btn-${charId}`);
            if (activeIcon) activeIcon.classList.add('active');

            // Inject Responsive Layout Structure
            const layoutContainer = document.getElementById('layout-container');
            layoutContainer.innerHTML = `
                <div id="layout-${charId}" class="char-layout active">
                    <div class="container">
                        <div class="content-area">
                            <div class="title-group">
                                <div class="kanji">${data.kanji || ""}</div>
                                <div class="quote page-quote"></div>
                                <h1 class="page-title"></h1>
                                <div class="subtitle page-subtitle"></div>
                            </div>
                            <div class="info-grid page-content">
                                <!-- Injected dynamically -->
                            </div>
                            <div class="image-gallery" id="thumb-gallery">
                                <!-- Thumbnails injected dynamically -->
                            </div>
                        </div>
                        <div class="hero-visual tilt-wrapper">
                            <div class="tilt-card">
                                <img src="" class="main-display-img" alt="Character Render" loading="eager">
                                <div class="card-glare"></div>
                                <div class="card-badge"><i class="fa-solid ${data.logoIcon}"></i></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Update Global Theme Variables
            document.documentElement.style.setProperty('--theme-color', data.themeColor);
            document.getElementById('nav-icon').className = `fa-solid ${data.logoIcon}`;
            document.getElementById('nav-text').innerText = data.logoText;

            // Strict Background Video Management
            if (data.bgVideo) {
                forceShowVideo(data.bgVideo);
            } else {
                forceHideVideo();
            }

            // Rebuild Navigation Links
            const navContainer = document.getElementById('dynamic-nav');
            navContainer.innerHTML = ''; 
            data.navLinks.forEach(link => {
                const a = document.createElement('a');
                a.innerText = link.label;
                a.dataset.target = link.id;
                a.onclick = () => loadContent(link.id);
                navContainer.appendChild(a);
            });

            // Rebuild Bottom Thumbnail Bar
            const thumbGallery = document.getElementById('thumb-gallery');
            if (thumbGallery && data.galleryImages) {
                thumbGallery.innerHTML = '';
                data.galleryImages.forEach((imgSrc, idx) => {
                    const img = document.createElement('img');
                    img.src = imgSrc;
                    img.alt = `${data.logoText} Thumbnail ${idx + 1}`;
                    img.loading = "lazy";
                    img.onclick = function() { changeImage(imgSrc, this); };
                    thumbGallery.appendChild(img);
                });
            }

            // Load Default Section
            loadContent('home');
        }

        // ==========================================
        // 6. CONTENT & GALLERY INJECTION
        // ==========================================
        function loadContent(sectionId) {
            const charData = characterDB[activeChar];
            const layout = document.getElementById(`layout-${activeChar}`);
            if (!layout) return;
            
            // Update Navigation State
            document.querySelectorAll('#dynamic-nav a').forEach(link => {
                link.classList.remove('active');
                if(link.dataset.target === sectionId) link.classList.add('active');
            });

            // Toggle bottom thumbnail bar visibility on full gallery view
            const thumbGallery = layout.querySelector('.image-gallery');
            if (thumbGallery) {
                thumbGallery.style.display = (sectionId === 'gallery') ? 'none' : 'flex';
            }

            const contentBox = layout.querySelector('.page-content');
            contentBox.style.opacity = '0';
            contentBox.style.transform = 'translateY(15px)';

            setTimeout(() => {
                if (sectionId === 'gallery') {
                    contentBox.style.display = 'block';
                    
                    // Build Full Animated Gallery with Downloads
                    let galleryHTML = '<div class="full-gallery" style="grid-column: span 2;">';
                    if (charData.galleryImages) {
                        charData.galleryImages.forEach(imgSrc => {
                            galleryHTML += `
                                <div class="gallery-item-wrap">
                                    <img src="${imgSrc}" alt="Gallery item" loading="lazy" onclick="changeImage('${imgSrc}', this)">
                                    <button type="button" class="download-btn" title="Download Image" onclick="event.stopPropagation(); downloadImageFile('${imgSrc}')">
                                        <i class="fa-solid fa-download"></i>
                                    </button>
                                </div>
                            `;
                        });
                    }
                    galleryHTML += '</div>';

                    layout.querySelector('.page-title').innerText = "GALLERY";
                    layout.querySelector('.page-subtitle').innerText = "Visual Archives & Downloads";
                    if(layout.querySelector('.page-quote')) layout.querySelector('.page-quote').innerText = "\"Download full-resolution archives.\"";
                    contentBox.innerHTML = galleryHTML;

                    if (charData.galleryImages && charData.galleryImages.length > 0) {
                        changeImage(charData.galleryImages[0]);
                    }
                } else {
                    contentBox.style.display = 'grid';
                    const secData = charData.sections[sectionId];
                    
                    layout.querySelector('.page-title').innerText = secData.title;
                    layout.querySelector('.page-subtitle').innerText = secData.subtitle;
                    contentBox.innerHTML = secData.content;
                    
                    if(layout.querySelector('.page-quote') && secData.quote) {
                        layout.querySelector('.page-quote').innerText = secData.quote;
                    }

                    changeImage(secData.image);
                }
                
                contentBox.style.opacity = '1';
                contentBox.style.transform = 'translateY(0)';
            }, 250);
        }

        // ==========================================
        // 7. IMAGE & BACKGROUND SYNC LOGIC
        // ==========================================
        function changeImage(imageSrc, thumbnailElement = null) {
            const layout = document.getElementById(`layout-${activeChar}`);
            if (!layout) return;
            const charData = characterDB[activeChar];
            
            if (thumbnailElement) {
                // Update active state in UI
                layout.querySelectorAll('.image-gallery img, .full-gallery img').forEach(img => img.classList.remove('active'));
                thumbnailElement.classList.add('active');
                
                // Do NOT hide the video if the character has a bgVideo. 
                if (!charData.bgVideo) {
                    forceHideVideo();
                    document.body.style.backgroundImage = `url('${imageSrc}')`;
                } else {
                    forceShowVideo(charData.bgVideo);
                }
            } else {
                // Auto-sync
                layout.querySelectorAll('.image-gallery img').forEach(img => {
                    img.classList.remove('active');
                    if(img.getAttribute('src') === imageSrc) img.classList.add('active');
                });

                if (!charData.bgVideo) {
                    forceHideVideo();
                    document.body.style.backgroundImage = `url('${imageSrc}')`;
                } else {
                    forceShowVideo(charData.bgVideo);
                }
            }
            
            const displayImg = layout.querySelector('.main-display-img');
            if (displayImg) displayImg.src = imageSrc;
        }

        // ==========================================
        // 8. ADAPTIVE 3D TILT ENGINE (Desktop Only)
        // ==========================================
        if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
            document.body.addEventListener('mousemove', (e) => {
                const wrapper = e.target.closest('.tilt-wrapper');
                if (!wrapper) return;
                
                const card = wrapper.querySelector('.tilt-card');
                const rect = wrapper.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = ((y - centerY) / centerY) * -12; 
                const rotateY = ((x - centerX) / centerX) * 12;

                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            });

            document.body.addEventListener('mouseleave', (e) => {
                const wrapper = e.target.closest('.tilt-wrapper');
                if (!wrapper) return;
                const card = wrapper.querySelector('.tilt-card');
                card.style.transform = `rotateX(0deg) rotateY(0deg)`;
            }, true);
        }
    </script>
